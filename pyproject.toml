[project]
name = "djangolearn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.4",
    "django-ratelimit>=4.1.0",
    "django-redis>=6.0.0",
    "google-generativeai>=0.8.6",
    "gunicorn>=23.0.0",
    "openai>=2.31.0",
    "psycopg[binary]>=3.2.0",
    "pymysql>=1.1.2",
    "python-dotenv>=1.2.2",
    "sqlparse>=0.5.5",
    "whitenoise>=6.9.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "MyDjango.settings"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
]
