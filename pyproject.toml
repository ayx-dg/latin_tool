[project]
name = "djangolearn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.4",
    "django-ratelimit>=4.1.0",
    "django-redis>=6.0.0",
    "google-generativeai>=0.8.6",
    "gunicorn>=23.0.0",
    "openai>=2.31.0",
    "psycopg[binary]>=3.2.0",
    "pymysql>=1.1.2",
    "python-dotenv>=1.2.2",
    "sqlparse>=0.5.5",
    "whitenoise>=6.9.0",
]

[tool.pytest.ini_options]
# 测试默认用内存 SQLite（MyDjango/settings_test.py），避免污染 Supabase 生产库
DJANGO_SETTINGS_MODULE = "MyDjango.settings_test"
# index/tests.py 不在默认的 test_*.py 匹配里，显式加上
python_files = ["test_*.py", "*_test.py", "tests.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
]
