services:
  - type: web
    name: latin-library
    runtime: docker
    plan: free
    # 建议和 Supabase 项目选同一个地区，减少连接延迟
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    numInstances: 1
    envVars:
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        # Render 的健康检查可能用内部主机名，限定域名会导致 400 判定为部署失败
        value: "*"
      - key: SECURE_SSL_REDIRECT
        # Render 边缘节点已强制 HTTPS，应用层再跳 301 会让健康检查拿到非 2xx
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
      - key: PORT
        value: "8000"
