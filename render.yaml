services:
  - type: web
    name: latin-library
    runtime: docker
    plan: free
    # 建议和 Supabase 项目选同一个地区，减少连接延迟
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    # works 表未导入前首页会 500，健康检查用不查库的 /healthz
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        # Render 的健康检查可能用内部主机名，限定域名会导致 400 判定为部署失败
        value: "*"
      - key: SECURE_SSL_REDIRECT
        # Render 边缘节点已强制 HTTPS，应用层再跳 301 会让健康检查拿到非 2xx
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
      - key: TURNSTILE_ENABLED
        # Cloudflare 验证脚本在部分网络加载不全，默认关闭
        value: "false"
      - key: TURNSTILE_HOSTNAMES
        # 生产环境不要包含 localhost / 127.0.0.1
        value: latin-library.onrender.com
      # 换模型只改这几个，不用改代码
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: PORT
        value: "8000"
